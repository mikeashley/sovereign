- name: Get a certificate from certbot
  command: certbot certonly -n --apache -d "www.{{ domain }}"
    creates=/etc/letsencrypt/live/www.{{ domain }}/privkey.pem

- name: Create directory for blog HTML
  file: state=directory path=/var/www/{{ domain }} group=www-data owner={{ main_user_name }}

- name: Disable default virtualhost for Apache
  command: a2dissite 000-default-le-ssl

- name: Disable this virtualhost if it already exists
  command: a2dissite {{ domain }} 

- name: Configure the Apache HTTP server for the blog
  template: src=etc_apache2_sites-available_blog.j2 dest=/etc/apache2/sites-available/{{ domain }}.conf group=root owner=root

- name: Enable blog site
  command: a2ensite {{ domain }} creates=/etc/apache2/sites-enabled/{{ domain }}.conf
  notify: restart apache

