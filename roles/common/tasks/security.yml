- name: Install security-related packages
  apt: pkg={{ item }} state=present
  with_items:
    - fail2ban
    - whois
    - lynis
    - rkhunter
  tags:
    - dependencies

- name: Copy fail2ban configuration into place
  template: src=etc_fail2ban_jail.local.j2 dest=/etc/fail2ban/jail.local
  notify: restart fail2ban

- name: Ensure fail2ban is started
  service: name=fail2ban state=started

- name: Update sshd config to update login grace time
  lineinfile: dest=/etc/ssh/sshd_config
              regexp=^#LoginGraceTime
              line="LoginGraceTime 2m"
              state=present
  notify: restart ssh

- name: Update sshd config to disable root login
  lineinfile: dest=/etc/ssh/sshd_config
              regexp=^PermitRootLogin
              line="PermitRootLogin no"
              state=present
  notify: restart ssh

- name: Update sshd config to turn on strict modes
  lineinfile: dest=/etc/ssh/sshd_config
              regexp=^#StrictModes
              line="StrictModes yes"
              state=present
  notify: restart ssh

- name: Update sshd config to specify Kex algorithms to use
  lineinfile: dest=/etc/ssh/sshd_config
              line="KexAlgorithms {{ kex_algorithms }}"
              state=present
  notify: restart ssh

- name: Update sshd config to specify ciphers to use
  lineinfile: dest=/etc/ssh/sshd_config
              line="Ciphers {{ ciphers }}"
              state=present
  notify: restart ssh

- name: Update sshd config to specify MACs to use
  lineinfile: dest=/etc/ssh/sshd_config
              line="MACs {{ macs }}"
              state=present
  notify: restart ssh

