- name: Install LetsEncrypt
  apt: pkg={{ item }} state=present
  with_items:
    - snapd
  tags:
    - dependencies

- name: Ensure snapd is installed
  snap: name=snapd state=present

- name: Install certbot
  snap:
    name: certbot
    state: present
    options:
    - trust-plugin-with-root=ok

- name: Create symlink to ensure certbot is accessible
  file: src=/snap/bin/certbot dest=/usr/bin/certbot state=link

- name: Get a certificate
  command: certbot run -n -m "{{ main_user_name }}@{{ domain }}" --no-eff-email --agree-tos --apache -d "www.{{ domain }}"
    creates=/etc/apache2/sites-available/000-default-le-ssl.conf
